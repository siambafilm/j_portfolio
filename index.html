<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

    <style>
        /* ===== БАЗА ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-gradient: linear-gradient(145deg, #0b1a33 0%, #1e2a4a 40%, #2d1b4e 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f0f4ff;
            --text-secondary: #c8d6e5;
            --text-muted: #94a3b8;
            --accent: #6c8cff;
            --accent-hover: #5a7ae0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --radius: 16px;
            --font-base: 20px;
            --font-large: 30px;
        }

        body {
            background: var(--bg-gradient);
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: var(--font-base);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 28px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            backdrop-filter: blur(2px);
        }

        .container { max-width: 1200px; width: 100%; }

        /* ===== СТЕКЛЯННЫЕ КАРТОЧКИ ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: 0.25s ease;
        }

        .glass:hover {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.10);
        }

        /* ===== ШАПКА ===== */
        .header {
            padding: 24px 32px;
            margin-bottom: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo { display: flex; align-items: center; gap: 16px; }
        .logo-icon { font-size: 44px; line-height: 1; }

        .logo-text {
            font-weight: 700;
            font-size: 30px;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .logo-text span { color: var(--accent); }

        .logo-sub {
            font-size: 17px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        .lang-switch {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.06);
            padding: 6px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
        }

        .lang-btn {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 600;
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
        }

        .lang-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }

        .lang-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 140, 255, 0.3);
        }

        /* ===== НАВИГАЦИЯ ===== */
        .nav {
            padding: 16px 24px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .nav-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 20px;
            padding: 12px 28px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        .nav-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-btn.construction { opacity: 0.4; cursor: not-allowed; }

        /* ===== ОСНОВНАЯ СЕТКА ===== */
        .content { display: grid; grid-template-columns: 250px 1fr; gap: 28px; }

        /* ===== САЙДБАР ===== */
        .sidebar { display: flex; flex-direction: column; gap: 20px; }
        .card { padding: 22px 24px; }

        .card h3 {
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .card ul { list-style: none; padding: 0; }

        .card ul li {
            font-size: 18px;
            padding: 8px 0;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card ul li:last-child { border-bottom: none; }

        .counter {
            font-family: 'Inter', monospace;
            font-size: 44px;
            font-weight: 700;
            color: var(--accent);
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px 0;
            letter-spacing: 2px;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
        }

        .badges span {
            font-size: 14px;
            font-weight: 600;
            padding: 6px 16px;
            background: rgba(255,255,255,0.06);
            border-radius: 30px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 1px solid var(--glass-border);
        }

        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .main { display: flex; flex-direction: column; gap: 28px; }
        .section { padding: 28px 32px; }

        .section-title {
            font-size: var(--font-large);
            font-weight: 700;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-primary);
        }

        .section-title .icon { font-size: 34px; color: var(--accent); }

        /* About */
        .about { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }

        .avatar {
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.06);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            flex-shrink: 0;
            border: 1px solid var(--glass-border);
        }

        .about-text {
            flex: 1;
            font-size: var(--font-base);
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .about-text p + p { margin-top: 14px; }
        .about-text strong { color: #fff; }

        .highlight {
            background: rgba(108, 140, 255, 0.2);
            color: var(--accent);
            padding: 0 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        /* Skills */
        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 18px;
        }

        .skill-item {
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: 0.2s;
        }

        .skill-item:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .skill-item .icon { font-size: 44px; display: block; margin-bottom: 6px; }
        .skill-item .name { font-size: var(--font-base); font-weight: 600; color: var(--text-primary); }

        .skill-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            margin-top: 10px;
            overflow: hidden;
        }

        .skill-bar-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--accent), #a78bfa);
            border-radius: 6px;
            transition: width 0.6s ease;
        }

        .skill-label {
            font-size: 16px;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
        }

        /* Portfolio */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .portfolio-item {
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid var(--glass-border);
        }

        .portfolio-item:hover {
            border-color: var(--accent);
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.3);
            background: rgba(255,255,255,0.08);
        }

        .portfolio-image {
            aspect-ratio: 4/3;
            background: rgba(108, 140, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: var(--accent);
            overflow: hidden;
        }

        .portfolio-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .portfolio-info { padding: 14px 16px 16px; text-align: center; }
        .portfolio-name { font-weight: 600; font-size: 18px; color: var(--text-primary); }
        .portfolio-tag { font-size: 15px; color: var(--text-muted); }

        /* Contacts */
        .contacts { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 14px; }

        .contacts li {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            font-size: var(--font-base);
            color: var(--text-secondary);
            border: 1px solid var(--glass-border);
            transition: 0.2s;
        }

        .contacts li:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.2);
        }

        .contacts li .icon { font-size: 28px; color: var(--accent); }

        .contacts li a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .contacts li a:hover { text-decoration: underline; }

        .guestbook {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            text-align: center;
            font-size: var(--font-base);
            color: var(--text-secondary);
            border: 1px dashed var(--glass-border);
        }

        .guestbook .btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: var(--font-base);
            padding: 12px 36px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            display: inline-block;
        }

        .guestbook .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 20px rgba(108, 140, 255, 0.4);
        }

        /* ===== ФУТЕР ===== */
        .footer {
            margin-top: 28px;
            padding: 24px 32px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 18px;
        }

        .footer .heart { color: var(--accent); }

        .footer-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 14px;
        }

        .footer-badges span {
            font-size: 13px;
            padding: 4px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 30px;
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
        }

        /* ===== МОДАЛЬНОЕ ОКНО ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: rgba(20, 30, 50, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            max-width: 1000px;
            width: 92%;
            max-height: 90vh;
            padding: 32px 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
            position: relative;
            overflow-y: auto;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 34px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
            z-index: 20;
        }

        .modal-close:hover { transform: rotate(90deg); color: #fff; }

        .modal-title {
            font-size: var(--font-large);
            font-weight: 700;
            margin-bottom: 16px;
            padding-right: 40px;
            color: var(--text-primary);
        }

        .modal-desc {
            font-size: 18px;
            line-height: 1.7;
            color: var(--text-secondary);
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        .modal-desc:empty { display: none; }

        .modal-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .modal-panel {
            min-width: 0;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 18px;
            border: 1px solid var(--glass-border);
        }

        .modal-panel h4 {
            font-size: 16px;
            text-transform: uppercase;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 8px;
            margin-bottom: 14px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* ===== ГАЛЕРЕЯ ===== */
        .gallery { display: flex; flex-direction: column; gap: 10px; }

        .gallery-main {
            position: relative;
            aspect-ratio: 4/3;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-main img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: rgba(0,0,0,0.15);
        }

        .gallery-fallback { font-size: 88px; color: var(--text-muted); line-height: 1; }

        .gallery-caption {
            font-size: 16px;
            color: var(--text-muted);
            text-align: center;
            min-height: 24px;
        }

        .gallery-thumbs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery-thumb {
            width: 68px;
            height: 52px;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.55;
            transition: 0.2s;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: var(--text-muted);
        }

        .gallery-thumb:hover { opacity: 1; }
        .gallery-thumb.active { border-color: var(--accent); opacity: 1; }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        /* ===== 3D ===== */
        .model-container {
            position: relative;          /* оверлей позиционируется относительно него */
            width: 100%;
            aspect-ratio: 4/3;
            min-height: 240px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            cursor: grab;
        }

        .model-container:active { cursor: grabbing; }
        .model-container canvas { display: block; width: 100%; height: 100%; }

        .model-hint {
            font-size: 16px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }

        /* Оверлей загрузки/ошибки — внутри .model-container, не перекрывает модалку */
        .model-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            font-size: 16px;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.85);
            z-index: 5;
            word-break: break-word;
            line-height: 1.5;
            white-space: pre-line;
        }

        .model-overlay.error { color: #ff8080; }

        /* ===== ЛОАДЕР ===== */
        .loader {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1a33;
            color: var(--text-secondary);
            font-size: 22px;
            text-align: center;
            padding: 30px;
            transition: opacity 0.35s;
        }

        .loader.hidden { opacity: 0; pointer-events: none; }
        .loader .err { color: #ff8080; max-width: 700px; line-height: 1.7; font-size: 19px; }
        .loader code {
            background: rgba(255,255,255,0.08);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 17px;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 850px) {
            .content { grid-template-columns: 1fr; }
            .sidebar { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .logo { justify-content: center; }
            .lang-switch { justify-content: center; }
            .nav { justify-content: center; }
            .modal-content { grid-template-columns: 1fr; }
        }

        @media (max-width: 550px) {
            body { padding: 14px; font-size: 18px; }
            :root { --font-base: 18px; --font-large: 26px; }
            .sidebar { grid-template-columns: 1fr; }
            .section { padding: 20px; }
            .nav-btn { font-size: 17px; padding: 10px 18px; }
            .modal { padding: 20px; }
            .modal-title { font-size: 24px; }
            .portfolio-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .header { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ===== ШАПКА ===== -->
    <header class="header glass">
        <div class="logo">
            <span class="logo-icon" id="logoIcon">🧊</span>
            <div>
                <div class="logo-text" id="logoTitle"></div>
                <div class="logo-sub" id="logoSub"></div>
            </div>
        </div>
        <div class="lang-switch" id="langSwitch"></div>
    </header>

    <!-- ===== НАВИГАЦИЯ ===== -->
    <nav class="nav glass">
        <a href="#about" class="nav-btn" data-i18n="navAbout"></a>
        <a href="#skills" class="nav-btn" data-i18n="navSkills"></a>
        <a href="#portfolio" class="nav-btn" data-i18n="navPortfolio"></a>
        <a href="#contacts" class="nav-btn" data-i18n="navContacts"></a>
        <a href="#" class="nav-btn construction" data-i18n="navGallery"></a>
        <a href="#" class="nav-btn construction" data-i18n="navBlog"></a>
    </nav>

    <!-- ===== КОНТЕНТ ===== -->
    <div class="content">
        <!-- САЙДБАР -->
        <aside class="sidebar">
            <div class="card glass">
                <h3 data-i18n="sidebarInfo"></h3>
                <ul id="sidebarInfoList"></ul>
            </div>
            <div class="card glass">
                <h3 data-i18n="sidebarCounter"></h3>
                <div class="counter" id="visitorCounter">00000</div>
            </div>
            <div class="card glass">
                <h3 data-i18n="sidebarBadges"></h3>
                <div class="badges" id="sidebarBadges"></div>
            </div>
        </aside>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <main class="main">
            <!-- ABOUT -->
            <section class="section glass" id="about">
                <h2 class="section-title">
                    <span class="icon">👤</span>
                    <span data-i18n="aboutTitle"></span>
                </h2>
                <div class="about">
                    <div class="avatar" id="aboutAvatar">👤</div>
                    <div class="about-text" id="aboutText"></div>
                </div>
            </section>

            <!-- SKILLS -->
            <section class="section glass" id="skills">
                <h2 class="section-title">
                    <span class="icon">⚡</span>
                    <span data-i18n="skillsTitle"></span>
                </h2>
                <div class="skills" id="skillsGrid"></div>
            </section>

            <!-- PORTFOLIO -->
            <section class="section glass" id="portfolio">
                <h2 class="section-title">
                    <span class="icon">🖼️</span>
                    <span data-i18n="portfolioTitle"></span>
                </h2>
                <div class="portfolio-grid" id="portfolioGrid"></div>
            </section>

            <!-- CONTACTS -->
            <section class="section glass" id="contacts">
                <h2 class="section-title">
                    <span class="icon">📫</span>
                    <span data-i18n="contactsTitle"></span>
                </h2>
                <ul class="contacts" id="contactsList"></ul>
                <div class="guestbook">
                    <span data-i18n="guestbookText"></span>
                    <br>
                    <button class="btn" id="guestbookBtn" data-i18n="guestbookBtn"></button>
                </div>
            </section>
        </main>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <footer class="footer glass">
        <div id="footerText"></div>
        <div class="footer-badges" id="footerBadges"></div>
    </footer>
</div>

<!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
<div class="modal-overlay" id="projectModalOverlay">
    <div class="modal">
        <button class="modal-close" id="modalCloseBtn">✕</button>
        <div class="modal-title" id="modalProjectTitle"></div>
        <div class="modal-desc" id="modalDesc"></div>
        <div class="modal-content">
            <div class="modal-panel">
                <h4 data-i18n="modalGallery"></h4>
                <div class="gallery">
                    <div class="gallery-main" id="galleryMain"></div>
                    <div class="gallery-caption" id="galleryCaption"></div>
                    <div class="gallery-thumbs" id="galleryThumbs"></div>
                </div>
            </div>
            <div class="modal-panel">
                <h4 data-i18n="modal3D"></h4>
                <div class="model-container" id="modelContainer"></div>
                <div class="model-hint" data-i18n="modalHint"></div>
            </div>
        </div>
    </div>
</div>

<!-- ===== ЛОАДЕР ===== -->
<div class="loader" id="loader"><div id="loaderText">Loading…</div></div>

<script>
(function () {
    'use strict';

    const DATA_URL = 'data.json';
    const LOG = '[3D]';

    let DATA = null;
    let currentLang = 'ru';
    let currentProject = null;
    let currentImageIndex = 0;

    /* =============================================
       ЛОКАЛИЗАЦИЯ
       ============================================= */
    function L(value) {
        if (value === null || value === undefined) return '';
        if (typeof value === 'string') return value;
        if (typeof value === 'number') return String(value);
        if (Array.isArray(value)) return value.map(L).join('');
        if (typeof value === 'object') {
            if (value[currentLang] !== undefined) return value[currentLang];
            if (value.ru !== undefined) return value.ru;
            const first = Object.values(value)[0];
            return first !== undefined ? first : '';
        }
        return String(value);
    }

    function label(key) {
        const item = DATA && DATA.labels ? DATA.labels[key] : null;
        return item ? L(item) : key;
    }

    function applyLabels() {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
            const key = el.getAttribute('data-i18n');
            const val = DATA && DATA.labels ? DATA.labels[key] : null;
            if (val !== undefined && val !== null) el.innerHTML = L(val);
        });
    }

    /* =============================================
       ЭЛЕМЕНТЫ
       ============================================= */
    const overlay    = document.getElementById('projectModalOverlay');
    const closeBtn   = document.getElementById('modalCloseBtn');
    const modalTitle = document.getElementById('modalProjectTitle');
    const modalDesc  = document.getElementById('modalDesc');
    const container  = document.getElementById('modelContainer');

    /* =============================================
       СЧЁТЧИК
       ============================================= */
    function initCounter() {
        const settings = DATA.settings || {};
        const start = Number(settings.counterStart) || 0;
        const key = (settings.storageKeys && settings.storageKeys.counter) || 'portfolio_counter';
        let value = start;
        try {
            const stored = localStorage.getItem(key);
            value = stored !== null ? (parseInt(stored, 10) || 0) + 1 : start;
            localStorage.setItem(key, value);
        } catch (e) { /* localStorage недоступен */ }
        document.getElementById('visitorCounter').textContent = String(value).padStart(5, '0');
    }

    /* =============================================
       ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ
       ============================================= */
    function buildLangSwitch() {
        const wrap = document.getElementById('langSwitch');
        wrap.innerHTML = '';
        const langs = (DATA.settings && DATA.settings.languages) || ['ru'];
        langs.forEach(function (code) {
            const b = document.createElement('button');
            b.className = 'lang-btn';
            b.dataset.lang = code;
            b.textContent = code.toUpperCase();
            b.addEventListener('click', function () { setLanguage(code); });
            wrap.appendChild(b);
        });
    }

    function setLanguage(lang) {
        currentLang = lang;
        if (DATA.settings) document.documentElement.lang = lang;

        applyLabels();
        renderDynamic();

        document.title = L(DATA.settings.pageTitle) || 'Portfolio';

        document.querySelectorAll('.lang-btn').forEach(function (b) {
            b.classList.toggle('active', b.dataset.lang === lang);
        });

        try {
            const key = (DATA.settings.storageKeys && DATA.settings.storageKeys.lang) || 'portfolio_lang';
            localStorage.setItem(key, lang);
        } catch (e) { /* ignore */ }

        if (overlay.classList.contains('active') && currentProject) {
            refreshModalTexts();
        }
    }

    /* =============================================
       РЕНДЕР ДАННЫХ
       ============================================= */
    function renderDynamic() {
        document.getElementById('logoIcon').textContent = DATA.site.logoIcon || '';
        document.getElementById('logoTitle').innerHTML = L(DATA.site.title);
        document.getElementById('logoSub').textContent = L(DATA.site.subtitle);

        const infoList = document.getElementById('sidebarInfoList');
        infoList.innerHTML = '';
        (DATA.sidebar.info || []).forEach(function (item) {
            const li = document.createElement('li');
            li.textContent = L(item);
            infoList.appendChild(li);
        });

        const badges = document.getElementById('sidebarBadges');
        badges.innerHTML = '';
        (DATA.sidebar.badges || []).forEach(function (b) {
            const s = document.createElement('span');
            s.textContent = L(b);
            badges.appendChild(s);
        });

        document.getElementById('aboutAvatar').textContent = DATA.about.avatar || '👤';
        const aboutText = document.getElementById('aboutText');
        aboutText.innerHTML = '';
        (DATA.about.paragraphs || []).forEach(function (p) {
            const el = document.createElement('p');
            el.innerHTML = L(p);
            aboutText.appendChild(el);
        });

        const skillsGrid = document.getElementById('skillsGrid');
        skillsGrid.innerHTML = '';
        (DATA.skills || []).forEach(function (s) {
            const item = document.createElement('div');
            item.className = 'skill-item';

            const icon = document.createElement('span');
            icon.className = 'icon';
            icon.textContent = s.icon || '⚡';

            const name = document.createElement('div');
            name.className = 'name';
            name.textContent = L(s.name);

            const bar = document.createElement('div');
            bar.className = 'skill-bar';
            const fill = document.createElement('div');
            fill.className = 'skill-bar-fill';
            fill.style.width = (Number(s.level) || 0) + '%';
            bar.appendChild(fill);

            const lbl = document.createElement('span');
            lbl.className = 'skill-label';
            lbl.textContent = (Number(s.level) || 0) + '%';

            item.appendChild(icon);
            item.appendChild(name);
            item.appendChild(bar);
            item.appendChild(lbl);
            skillsGrid.appendChild(item);
        });

        renderPortfolio();

        const contactsList = document.getElementById('contactsList');
        contactsList.innerHTML = '';
        (DATA.contacts || []).forEach(function (c) {
            const li = document.createElement('li');

            const icon = document.createElement('span');
            icon.className = 'icon';
            icon.textContent = c.icon || '•';
            li.appendChild(icon);

            const span = document.createElement('span');
            if (c.href) {
                const a = document.createElement('a');
                a.href = c.href;
                a.textContent = L(c.text);
                span.appendChild(a);
            } else {
                span.textContent = L(c.text);
            }
            if (c.note) {
                const note = document.createElement('span');
                note.textContent = ' ' + L(c.note);
                span.appendChild(note);
            }
            li.appendChild(span);
            contactsList.appendChild(li);
        });

        document.getElementById('footerText').innerHTML = L(DATA.footer.text);
        const fBadges = document.getElementById('footerBadges');
        fBadges.innerHTML = '';
        (DATA.footer.badges || []).forEach(function (b) {
            const s = document.createElement('span');
            s.textContent = L(b);
            fBadges.appendChild(s);
        });
    }

    /* =============================================
       ПОРТФОЛИО
       ============================================= */
    function renderPortfolio() {
        const grid = document.getElementById('portfolioGrid');
        grid.innerHTML = '';

        (DATA.projects || []).forEach(function (p) {
            const item = document.createElement('div');
            item.className = 'portfolio-item';

            const imageWrap = document.createElement('div');
            imageWrap.className = 'portfolio-image';

            const first = (p.images || [])[0];
            if (first && first.src) {
                const im = document.createElement('img');
                im.src = first.src;
                im.alt = L(first.caption) || L(p.name);
                im.loading = 'lazy';
                im.addEventListener('error', function () {
                    im.remove();
                    imageWrap.textContent = p.icon || '📦';
                });
                imageWrap.appendChild(im);
            } else {
                imageWrap.textContent = p.icon || '📦';
            }

            const info = document.createElement('div');
            info.className = 'portfolio-info';

            const name = document.createElement('div');
            name.className = 'portfolio-name';
            name.textContent = L(p.name);

            const tag = document.createElement('div');
            tag.className = 'portfolio-tag';
            tag.textContent = L(p.tag);

            info.appendChild(name);
            info.appendChild(tag);
            item.appendChild(imageWrap);
            item.appendChild(info);

            item.addEventListener('click', function () { openProjectModal(p.id); });
            grid.appendChild(item);
        });
    }

    /* =============================================
       ГАЛЕРЕЯ В МОДАЛКЕ
       ============================================= */
    function makeFallback(proj) {
        const d = document.createElement('div');
        d.className = 'gallery-fallback';
        d.textContent = proj.icon || '🖼️';
        return d;
    }

    function buildGallery(proj) {
        const main = document.getElementById('galleryMain');
        const thumbs = document.getElementById('galleryThumbs');
        const images = (proj.images || []).filter(function (i) { return i && i.src; });

        main.innerHTML = '';
        thumbs.innerHTML = '';
        currentImageIndex = 0;

        if (!images.length) {
            thumbs.style.display = 'none';
            main.appendChild(makeFallback(proj));
            updateCaption();
            return;
        }

        const img = document.createElement('img');
        img.src = images[0].src;
        img.alt = L(images[0].caption) || L(proj.name);
        img.addEventListener('error', function () {
            img.remove();
            if (!main.querySelector('.gallery-fallback')) main.appendChild(makeFallback(proj));
        });
        main.appendChild(img);

        if (images.length > 1) {
            thumbs.style.display = '';
            images.forEach(function (im, idx) {
                const btn = document.createElement('div');
                btn.className = 'gallery-thumb' + (idx === 0 ? ' active' : '');

                const t = document.createElement('img');
                t.src = im.src;
                t.alt = '';
                t.loading = 'lazy';
                t.addEventListener('error', function () {
                    t.remove();
                    btn.textContent = proj.icon || '🖼️';
                });
                btn.appendChild(t);

                btn.addEventListener('click', function () { selectImage(proj, images, idx); });
                thumbs.appendChild(btn);
            });
        } else {
            thumbs.style.display = 'none';
        }

        updateCaption();
    }

    function selectImage(proj, images, idx) {
        currentImageIndex = idx;
        const main = document.getElementById('galleryMain');
        main.innerHTML = '';

        const img = document.createElement('img');
        img.src = images[idx].src;
        img.alt = L(images[idx].caption) || L(proj.name);
        img.addEventListener('error', function () {
            img.remove();
            main.appendChild(makeFallback(proj));
        });
        main.appendChild(img);

        document.querySelectorAll('.gallery-thumb').forEach(function (b, i) {
            b.classList.toggle('active', i === idx);
        });

        updateCaption();
    }

    function updateCaption() {
        const cap = document.getElementById('galleryCaption');
        if (!currentProject) { cap.textContent = ''; return; }
        const images = (currentProject.images || []).filter(function (i) { return i && i.src; });
        const img = images[currentImageIndex];
        cap.textContent = img ? L(img.caption) : '';
    }

    /* =============================================
       МОДАЛЬНОЕ ОКНО
       ============================================= */
    function refreshModalTexts() {
        if (!currentProject) return;
        modalTitle.textContent = L(currentProject.name);
        const text = L(currentProject.description);
        modalDesc.innerHTML = text;
        modalDesc.style.display = text ? '' : 'none';
        updateCaption();
    }

    function openProjectModal(id) {
        const proj = (DATA.projects || []).find(function (p) { return p.id === id; });
        if (!proj) {
            console.warn(LOG, 'проект не найден по id:', id);
            return;
        }

        console.log(LOG, 'открываю проект:', proj.id, proj.model);

        currentProject = proj;
        refreshModalTexts();
        buildGallery(proj);

        overlay.classList.add('active');
        setTimeout(function () { initThree(proj); }, 60);
    }

    function closeModal() {
        overlay.classList.remove('active');
        currentProject = null;
        loadToken++;   // инвалидируем все незавершённые загрузки
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        if (renderer) { renderer.dispose(); renderer = null; }
        if (scene) {
            scene.traverse(function (o) {
                if (o.geometry) o.geometry.dispose();
                if (o.material) {
                    if (Array.isArray(o.material)) o.material.forEach(function (m) { m.dispose(); });
                    else o.material.dispose();
                }
            });
            scene = null;
        }
        if (controls) { controls.dispose(); controls = null; }
        container.innerHTML = '';
    }

    closeBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('active')) closeModal();
    });

    /* =============================================
       THREE.JS — встроенные процедурные модели
       ============================================= */
    let scene, camera, renderer, controls, animId;
    let loadToken = 0;

    function createObject(type, color) {
        const g = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
            color: color,
            roughness: 0.3,
            metalness: 0.7,
            emissive: new THREE.Color(color).multiplyScalar(0.15)
        });

        switch (type) {
            case 'gear': {
                const b = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.3, 32), mat);
                const t = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.12, 16, 32), mat);
                t.rotation.x = Math.PI / 2; t.position.z = 0.15;
                const h = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.5, 16), mat);
                g.add(b, t, h);
                break;
            }
            case 'building': {
                const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2, 1), mat);
                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.1, 0.7, 4), mat);
                roof.position.y = 1.35; roof.rotation.y = Math.PI / 4;
                const win = new THREE.Mesh(
                    new THREE.BoxGeometry(1.55, 0.2, 1.05),
                    new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.2 })
                );
                win.position.y = 0.2;
                g.add(body, roof, win);
                break;
            }
            case 'robot': {
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), mat);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), mat);
                head.position.y = 0.9;
                const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1, 8), mat);
                armL.position.set(-0.6, 0.2, 0); armL.rotation.z = 0.3;
                const armR = armL.clone(); armR.position.x = 0.6; armR.rotation.z = -0.3;
                g.add(torso, head, armL, armR);
                break;
            }
            case 'vase': {
                const pts = [
                    new THREE.Vector2(0, 0), new THREE.Vector2(0.6, 0), new THREE.Vector2(0.7, 0.3),
                    new THREE.Vector2(0.4, 0.8), new THREE.Vector2(0.5, 1.2), new THREE.Vector2(0.3, 1.4),
                    new THREE.Vector2(0.35, 1.5)
                ];
                g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 32), mat));
                break;
            }
            case 'fastener': {
                const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2, 6), mat);
                bolt.rotation.x = Math.PI / 2;
                const head = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 6), mat);
                head.position.z = 0.7; head.rotation.x = Math.PI / 2;
                const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.4, 6), mat);
                nut.position.z = 0; nut.rotation.x = Math.PI / 2;
                g.add(bolt, head, nut);
                break;
            }
            case 'character': {
                const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), mat);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), mat);
                head.position.y = 1.1;
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xf0f4ff });
                const eL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
                eL.position.set(-0.18, 1.15, 0.4);
                const eR = eL.clone(); eR.position.x = 0.18;
                g.add(body, head, eL, eR);
                break;
            }
            default:
                g.add(new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat));
        }
        return g;
    }

    function initThree(proj) {
        const myToken = ++loadToken;
        const cfg = proj.model || {};
        container.innerHTML = '';

        const w = container.clientWidth || 400;
        const h = container.clientHeight || 300;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1a33);

        camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
        camera.position.set(3, 2, 4);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.55));

        const dir = new THREE.DirectionalLight(0xffffff, 0.95);
        dir.position.set(5, 10, 7);
        dir.castShadow = true;
        scene.add(dir);

        const fill = new THREE.PointLight(0x6c8cff, 0.5);
        fill.position.set(-3, 2, 2);
        scene.add(fill);

        const hemi = new THREE.HemisphereLight(0xffffff, 0x1e2a4a, 0.4);
        scene.add(hemi);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5;
        controls.target.set(0, 0, 0);
        controls.update();

        function addFloor(y) {
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(20, 20),
                new THREE.ShadowMaterial({ opacity: 0.35 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = y;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function fitAndCenter(obj, extraScale) {
            const box = new THREE.Box3().setFromObject(obj);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            obj.position.sub(center);
            const maxDim = Math.max(size.x, size.y, size.z) || 1;
            const targetSize = 2.8;
            const s = (targetSize / maxDim) * (extraScale || 1);
            obj.scale.setScalar(s);
            return { bottom: (-size.y / 2) * s, size: size.clone().multiplyScalar(s) };
        }

        // ====== ВНЕШНЯЯ МОДЕЛЬ ======
        if (cfg.url) {
            console.log(LOG, 'initThree: старт загрузки', cfg.url, 'scale=', cfg.scale);

            const overlayEl = document.createElement('div');
            overlayEl.className = 'model-overlay';
            overlayEl.textContent = 'Загрузка 0%';
            container.appendChild(overlayEl);

            let finished = false;
            function finishLoad() {
                if (finished) return;
                finished = true;
                if (overlayEl.parentNode) overlayEl.parentNode.removeChild(overlayEl);
                console.log(LOG, 'initThree: плашка снята');
            }

            const manager = new THREE.LoadingManager();
            manager.onStart = function (url) {
                console.log(LOG, 'manager.onStart', url);
            };
            manager.onProgress = function (url, loaded, total) {
                console.log(LOG, 'manager.onProgress', url, loaded + '/' + total);
            };
            manager.onLoad = function () {
                console.log(LOG, 'manager.onLoad (все ресурсы скачаны)');
            };
            manager.onError = function (url) {
                console.warn(LOG, 'manager.onError — не загрузился ресурс:', url);
            };

            const loader = new THREE.GLTFLoader(manager);

            // Draco подключаем всегда — вреда нет, а если модель сжата, чинит её
            if (THREE.DRACOLoader) {
                const draco = new THREE.DRACOLoader(manager);
                draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
                loader.setDRACOLoader(draco);
                console.log(LOG, 'DRACOLoader подключён');
            } else {
                console.warn(LOG, 'DRACOLoader недоступен — сжатые GLB не загрузятся');
            }

            // Сторожевой таймаут
            const guard = setTimeout(function () {
                if (finished || myToken !== loadToken) return;
                console.warn(LOG, 'таймаут 25 с — парсинг модели завис:', cfg.url);
                finished = true;
                overlayEl.classList.add('error');
                overlayEl.textContent =
                    'Модель не загрузилась за 25 с.\n' +
                    'Скорее всего GLB использует неподдерживаемое расширение.\n' +
                    'Проверьте ' + cfg.url + ' в https://gltf-viewer.donmccurdy.com/';
            }, 25000);

            console.log(LOG, 'вызываю loader.load()');
            loader.load(
                cfg.url,
                function (gltf) {
                    clearTimeout(guard);
                    console.log(LOG, 'onLoad — модель получена:', cfg.url);
                    console.log(LOG, 'gltf:', gltf);

                    if (myToken !== loadToken) {
                        console.log(LOG, 'устаревший onLoad — игнорирую (модалку переоткрыли/закрыли)');
                        return;
                    }

                    try {
                        const obj = gltf.scene || (gltf.scenes && gltf.scenes[0]);
                        if (!obj) throw new Error('gltf.scene отсутствует');

                        let meshCount = 0;
                        obj.traverse(function (o) {
                            if (o.isMesh) {
                                meshCount++;
                                o.castShadow = true;
                                o.receiveShadow = true;
                                if (o.material) o.material.side = THREE.DoubleSide;
                            }
                        });
                        console.log(LOG, 'меш‑ов в модели:', meshCount);

                        const info = fitAndCenter(obj, Number(cfg.scale) || 1);
                        console.log(LOG, 'размеры после нормализации:', info.size);

                        scene.add(obj);
                        addFloor(info.bottom - 0.05);

                        controls.target.set(0, 0, 0);
                        controls.update();

                        const r = Math.max(info.size.x, info.size.y, info.size.z);
                        camera.position.set(r * 1.4, r * 1.0, r * 1.8);
                        camera.lookAt(0, 0, 0);
                        controls.update();

                        console.log(LOG, 'модель добавлена в сцену, камера настроена');
                    } catch (e) {
                        console.error(LOG, 'ошибка при обработке модели:', e);
                    } finally {
                        finishLoad();
                    }
                },
                function (xhr) {
                    if (finished || myToken !== loadToken) return;
                    if (xhr.total) {
                        const p = Math.round((xhr.loaded / xhr.total) * 100);
                        overlayEl.textContent = 'Загрузка ' + p + '%';
                        // Логируем не каждый байт, а примерно каждые 10%
                        if (!xhr._lastPct || Math.abs(p - xhr._lastPct) >= 10) {
                            xhr._lastPct = p;
                            console.log(LOG, 'progress', p + '%', xhr.loaded + '/' + xhr.total);
                        }
                    } else if (xhr.loaded) {
                        overlayEl.textContent = 'Загрузка ' +
                            Math.round(xhr.loaded / 1024) + ' КБ';
                    }
                },
                function (err) {
                    clearTimeout(guard);
                    if (myToken !== loadToken) return;
                    finished = true;
                    console.error(LOG, 'onError — модель не загрузилась:', cfg.url, err);
                    overlayEl.classList.add('error');
                    overlayEl.textContent =
                        'Не удалось загрузить ' + cfg.url +
                        (err && err.message ? '\n' + err.message : '');
                }
            );
        }
        // ====== ВСТРОЕННАЯ ПРОЦЕДУРНАЯ МОДЕЛЬ ======
        else {
            console.log(LOG, 'initThree: процедурная модель', cfg.type, 'color=', cfg.color);
            const colorHex = new THREE.Color(cfg.color || '#6c8cff').getHex();
            const obj = createObject(cfg.type || 'box', colorHex);
            obj.scale.setScalar(Number(cfg.scale) || 1);
            obj.castShadow = true;
            obj.receiveShadow = true;
            scene.add(obj);
            addFloor(-1.2);
        }

        if (animId) cancelAnimationFrame(animId);
        (function animate() {
            animId = requestAnimationFrame(animate);
            if (myToken !== loadToken) return;   // цикл устарел
            controls.update();
            renderer.render(scene, camera);
        })();
    }

    window.addEventListener('resize', function () {
        if (renderer && camera && container && container.clientWidth) {
            const w = container.clientWidth;
            const h = container.clientHeight || 280;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
    });

    /* =============================================
       ПЛАВНЫЙ СКРОЛЛ + ГОСТЕВАЯ КНИГА
       ============================================= */
    function bindScroll() {
        document.querySelectorAll('.nav-btn[href^="#"]').forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    }

    document.getElementById('guestbookBtn').addEventListener('click', function () {
        alert(label('guestbookAlert'));
    });

    /* =============================================
       ЗАГРУЗКА
       ============================================= */
    function showError(err) {
        const box = document.getElementById('loaderText');
        box.className = 'err';
        box.innerHTML =
            '<b>Не удалось загрузить data.json</b><br><br>' +
            'Ошибка: ' + (err && err.message ? err.message : err) + '<br><br>' +
            'Если вы открыли файл двойным кликом (протокол <code>file://</code>), ' +
            'браузер блокирует чтение JSON. Запустите локальный сервер:<br><br>' +
            '<code>python -m http.server 8000</code><br><br>' +
            'и откройте <code>http://localhost:8000</code>';
    }

    async function init() {
        console.log(LOG, 'init: загружаю data.json…');
        try {
            const res = await fetch(DATA_URL, { cache: 'no-store' });
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
            DATA = await res.json();
            console.log(LOG, 'data.json загружен, проектов:', (DATA.projects || []).length);
        } catch (err) {
            console.error(LOG, 'ошибка загрузки data.json:', err);
            showError(err);
            return;
        }

        DATA.settings  = DATA.settings  || {};
        DATA.labels    = DATA.labels    || {};
        DATA.sidebar   = DATA.sidebar   || {};
        DATA.about     = DATA.about     || {};
        DATA.footer    = DATA.footer    || {};

        initCounter();
        buildLangSwitch();

        let lang = DATA.settings.defaultLang || 'ru';
        try {
            const key = (DATA.settings.storageKeys && DATA.settings.storageKeys.lang) || 'portfolio_lang';
            const saved = localStorage.getItem(key);
            if (saved) lang = saved;
        } catch (e) { /* ignore */ }

        const available = (DATA.settings.languages || []).map(String);
        if (available.length && available.indexOf(lang) === -1) lang = available[0];

        setLanguage(lang);
        bindScroll();

        document.getElementById('loader').classList.add('hidden');
        console.log(LOG, 'init завершён');
    }

    init();
})();
</script>
</body>
</html>
